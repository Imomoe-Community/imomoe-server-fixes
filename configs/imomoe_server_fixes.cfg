// ============================================================================
// Imomoe Server Fixes - Default Configuration / 默认配置文件
// Install to / 安装位置: game/csgo/cfg/imomoe_server_fixes.cfg
// Add to server.cfg / 在 server.cfg 中添加: exec imomoe_server_fixes.cfg
// ============================================================================

// Block say / say_team from clients before they finish entering the game.
// 拦截尚未完全进入游戏（Pre-InGame）的客户端发送的聊天指令。
sf_chat_admission 1

// Enable CT hostage rescue compensation and T hostage pickup support.
// 启用 CT 人质救援触发补偿与 T 阵营背人质兼容（受 mp_only_cts_rescue_hostages 控制）。
sf_hostage_compat 1

// Automatically supplement team spawn points on every map and enable manual spawn tools.
// 在所有地图上自动补齐队伍出生点容量并启用手动出生点管理工具。
sf_spawn_capacity 1

// Keep mp_spectators_max and GameRules spectator slots aligned with actual maxplayers.
// 将观察者上限（mp_spectators_max 与 GameRules 槽位数）自动对齐至服务器实际最大玩家数。
sf_spectator_compat 1

// Repair stale GC bans on a verified build. Keeps the native cooldown CVar unchanged.
// 在已验证的版本修复 GC 封禁残留，不修改原生冷却开关；按需启用。
sf_game_ban_fix 0

// Server Console Commands / 服务端控制台常用命令:
//   sf_status                                    - Check module status / 查看各模块状态
//   sf_spawn_add <T|CT> <x> <y> <z> [p y r]      - Add a manual spawn point / 添加手动出生点
//   sf_spawn_list                                - List manual spawn points / 列出当前手动出生点
//   sf_spawn_remove <id>                         - Remove a manual spawn point / 删除指定手动出生点
//   sf_spawn_save                                - Save manual points to disk / 保存出生点配置到磁盘
