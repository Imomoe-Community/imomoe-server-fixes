// ============================================================================
// Imomoe Server Fixes - Default Configuration / 默认配置文件
// Install to / 安装位置: game/csgo/cfg/imomoe_server_fixes.cfg
// Add to server.cfg / 在 server.cfg 中添加: exec imomoe_server_fixes.cfg
// ============================================================================

// Block say / say_team from clients before they finish entering the game.
// 拦截尚未完全进入游戏（Pre-InGame）的客户端发送的聊天指令。
sf_chat_admission 1

// Enable CT hostage rescue compensation and T hostage pickup support.
// 启用 CT 人质救援触发补偿与 T 阵营背人质兼容（受 mp_only_cts_rescue_hostages 控制）。
sf_hostage_compat 1

// Automatically supplement team spawn points on every map and enable manual spawn tools.
// 在所有地图上自动补齐队伍出生点容量并启用手动出生点管理工具。
sf_spawn_capacity 1

// Keep mp_spectators_max and GameRules spectator slots aligned with actual maxplayers.
// 将观察者上限（mp_spectators_max 与 GameRules 槽位数）自动对齐至服务器实际最大玩家数。
sf_spectator_compat 1

// Repair stale GC bans on a verified build. Keeps the native cooldown CVar unchanged.
// 在已验证的版本修复 GC 封禁残留，不修改原生冷却开关；按需启用。
sf_game_ban_fix 0

// Native entity fixes. On supported builds, verify availability with sf_status.
// 原生实体修复；在支持的构建上可用 sf_status 查看状态。
sf_beam_fix 1
sf_filter_activator_fix 1
sf_equip_precache_fix 1
sf_free_client_fix 0
sf_hammer_id 0 // 保留地图实体的 Hammer ID；启用后从下次实体初始化起生效
sf_cstv_bot_quota 0 // 原生 BOT 配额筛选时排除 CSTV，不改变 BOT 配额
sf_water_jump 0 // 水中移动后仅跳过紧接的一次触底分类
sf_jump_spam 0 // 每个活体每个移动 tick 最多结算一次原生跳跃，默认保留连跳玩法
sf_rampbug 0 // 斜坡接缝出现不一致碰撞时复查轨迹，保留正常移动和水中跳跃修复

// Opt-in guards from GameFixes. 0 disables a rate guard; excess requests are dropped, not kicked.
// 按需启用。限额设 0 表示关闭；超额只丢弃当次请求，不踢玩家。
sf_voice_fix 0 // 忽略缺少 audio 字段的语音消息，无需启用限流
sf_voice_max_per_second 0 // 开启时建议从 128 开始
sf_voice_max_bytes 4096
sf_voice_max_packets 64
sf_team_switch_limit 0 // 开启时建议每十秒 15 次
sf_noclip_reset 0 // 关闭 sv_cheats 时恢复走路，重生不继承 noclip
sf_workshop_voice 0 // 创意工坊地图上分离每个说话者的语音流
sf_player_ghost 0 // 回合解除冻结时恢复残留活体的观察者状态
sf_keyvalues_flood 0 // 按连接限制 KeyValues 指令，超额只丢弃当次请求
sf_keyvalues_per_second 10
sf_keyvalues_burst 20
sf_keyvalues_max_bytes 1500
sf_blank_map 0 // 比赛结束没有目标且引擎未安排换图时，重新加载当前地图

// 长时间运行的地图：空服可刷新；有人时优先等下一场，超时后先通知再等回合结束。
sf_slow_animation 0
sf_animation_idle_reload_seconds 1800 // 0 = 不安排空服刷新
sf_animation_idle_grace_seconds 300
sf_animation_max_map_minutes 180 // 0 = 有人时不安排刷新
sf_animation_match_wait_minutes 120
sf_animation_warn_minutes 2
sf_animation_round_wait_minutes 10

// Server Console Commands / 服务端控制台常用命令:
//   sf_status                                    - Check module status / 查看各模块状态
//   sf_spawn_add <T|CT> <x> <y> <z> [p y r]      - Add a manual spawn point / 添加手动出生点
//   sf_spawn_list                                - List manual spawn points / 列出当前手动出生点
//   sf_spawn_remove <id>                         - Remove a manual spawn point / 删除指定手动出生点
//   sf_spawn_save                                - Save manual points to disk / 保存出生点配置到磁盘
